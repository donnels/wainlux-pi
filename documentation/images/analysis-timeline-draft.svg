<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050" role="img" aria-labelledby="title description">
  <title id="title">Audio and laser timeline: proposed investigation view</title>
  <desc id="description">Illustrative design, not measurements from a real run. A continuous audio waveform, received packet lane, sending lane, job lane and synchronization lane share a time axis and red cursor. A full recording overview has a movable window. A detail ruler shows 200 millisecond subdivisions.</desc>
  <defs>
    <style>
      text { font-family: 'DejaVu Sans', sans-serif; fill: #233139; font-size: 14px; }
      .heading { font-size: 25px; font-weight: 700; }
      .label { font-size: 13px; font-weight: 700; }
      .small { font-size: 12px; fill: #576871; }
      .mono { font-family: 'DejaVu Sans Mono', monospace; font-size: 12px; }
      .grid { stroke: #dce3e6; stroke-width: 1; }
      .separator { stroke: #b9c7ce; stroke-width: 1; }
    </style>
    <pattern id="fine-ticks" width="15.7867" height="390" patternUnits="userSpaceOnUse" x="190" y="296">
      <path d="M0 0V7" stroke="#7e919b" fill="none"/>
    </pattern>
    <pattern id="overview-audio" width="20" height="42" patternUnits="userSpaceOnUse" x="190" y="157">
      <path d="M0 21L2 16L4 27L6 8L8 34L10 18L12 24L14 12L16 29L18 19L20 21" fill="none" stroke="#435e69" stroke-width="1"/>
    </pattern>
    <clipPath id="audio-clip"><rect x="190" y="325" width="1110" height="150"/></clipPath>
  </defs>
  <rect width="1440" height="1050" fill="#f4f7f8"/>
  <text x="40" y="45" class="heading">Audio / laser event alignment</text>
  <text x="40" y="70" class="small">DESIGN DRAFT - synthetic waveform, packet times and job metadata; not the historical LAN report</text>
