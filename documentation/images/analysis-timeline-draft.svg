  <text x="592" y="111" class="mono">0.25  0.5  0.75  1  2  [4]  8  16  32x</text>
  <text x="1040" y="111" class="small">Scale: reference peak v</text>
  <text x="40" y="179" class="label">Full recording</text>
  <rect x="190" y="150" width="1110" height="49" fill="#fff" stroke="#bac8ce"/>
  <rect x="190" y="153" width="1052" height="42" fill="url(#overview-audio)"/>
  <path d="M1242 174H1300" stroke="#435e69"/>
  <rect x="1235" y="147" width="9" height="55" fill="#167d89" fill-opacity="0.25" stroke="#167d89" stroke-width="2"/>
  <path d="M1231 157V191M1248 157V191" stroke="#167d89" stroke-width="3"/>
  <path d="M1239 205L1224 216M1239 205L1254 216" stroke="#167d89" fill="none"/>
