    <text x="1116" y="315">28:27</text><text x="1264" y="315">28:29</text>
  </g>
  <text x="40" y="367" class="label">Audio</text>
  <text x="40" y="388" class="small">Signed amplitude</text>
  <text x="40" y="409" class="small">not activity blocks</text>
  <path d="M190 400H1300" stroke="#aabcc5"/>
