  <text x="789" y="521" class="small">last 99%</text>
  <text x="40" y="560" class="label">Host TX</text>
  <text x="40" y="577" class="small">Transfer / commands</text>
  <path d="M190 556H1300" stroke="#dce3e6"/>
  <path d="M209 541V570" stroke="#b07623" stroke-width="2"/>
  <text x="233" y="560" class="small">No bulk transfer in this window; DATA spans appear here when timestamped.</text>
  <text x="40" y="609" class="label">Jobs / bands</text>
  <rect x="190" y="590" width="1110" height="34" rx="3" fill="#e1eef0" stroke="#2d7c87"/>
  <text x="210" y="612">Band 3 / card 2 / Wi-Fi / front - waiting for completion feedback</text>
  <text x="40" y="663" class="label">Run / sync</text>
  <text x="210" y="662" class="small">Run active - ID cue and job start are earlier; software finish is later (see overview below).</text>
  <path d="M917 289V686" stroke="#cf3548" stroke-width="2"/>
  <path d="M911 289H923L917 296Z" fill="#cf3548"/>
  <rect x="932" y="334" width="238" height="65" rx="3" fill="#fff" stroke="#cf3548"/>
  <text x="948" y="359" class="label">Cursor / playback 28:24.220</text>
  <text x="948" y="382" class="small">User-judged audible activity end</text>
  <path d="M884 489L874 461" stroke="#137b63"/>
  <rect x="535" y="332" width="340" height="71" rx="3" fill="#fff" stroke="#137b63"/>
  <text x="551" y="354" class="label">RX selected / hover detail</text>
  <text x="551" y="375" class="mono">28:23.800 - decoded status: 99%</text>
  <text x="551" y="393" class="small">Raw bytes + phase + band + timestamp source</text>
  <text x="40" y="721" class="label">Ruler detail</text>
  <text x="190" y="721" class="small">At high zoom: whole-second anchors with 200 ms subdivisions; detailed cursor remains millisecond-readable.</text>
  <path d="M190 748H1300" stroke="#81949e"/>
  <g stroke="#81949e"><path d="M190 736V748M348 742V748M507 742V748M665 742V748M824 742V748M983 736V748M1141 742V748M1300 742V748"/></g>
  <g class="mono">
    <text x="190" y="769">28:23.0</text><text x="337" y="769">.2</text><text x="496" y="769">.4</text><text x="654" y="769">.6</text>
    <text x="813" y="769">.8</text><text x="956" y="769">28:24.0</text><text x="1130" y="769">.2</text><text x="1275" y="769">.4</text>
  </g>
  <path d="M824 779V803M1157 779V803" stroke="#576871"/>
  <path d="M824 793H1157" stroke="#576871"/>
  <text x="865" y="816" class="mono">99% to cursor: +0.420 s</text>
  <text x="40" y="856" class="label">At 1x</text>
  <text x="190" y="856" class="small">Same lanes, full recording; blocks have hover/select details. Dense packets group by pixel, not by invented time.</text>
  <path d="M190 882H1300" stroke="#81949e"/>
  <rect x="202" y="871" width="14" height="22" fill="#6589bc"><title>Illustrative ID cue: recording ID, cue start/end and correlation quality</title></rect>
  <path d="M220 866V897" stroke="#167d89" stroke-width="2"/>
  <rect x="227" y="874" width="65" height="16" fill="#ddb86f"><title>Illustrative DATA transfer: duration, byte count and command metadata; no private raster payload</title></rect>
  <rect x="297" y="871" width="999" height="22" fill="#e1eef0" stroke="#2d7c87"><title>Illustrative job band: Wi-Fi card front, power/depth, start/end boundaries and completion policy</title></rect>
  <path d="M1241 866V897" stroke="#137b63" stroke-width="2"/>
  <path d="M1296 866V897" stroke="#a33f5b" stroke-width="2"><title>Illustrative software finish at 29:53.800: 90 seconds after last received data, assumed completion, not motion confirmation</title></path>
  <text x="190" y="921" class="small">ID beeps / sync</text><text x="357" y="921" class="small">Job start + sending</text>
  <text x="1045" y="921" class="small">Last 99%</text><text x="1190" y="944" class="small">Software finish</text>
  <text x="190" y="944" class="small">Hover/select: band n of card y or sweep x, settings, duration and recorded completion reason.</text>
  <text x="40" y="995" class="small">Evidence policy: audio supports the user's judgment; software completion and RX progress remain separate facts.</text>
  <text x="40" y="1018" class="small">Capture gaps / truncation / sync uncertainty stay visible. TX bytes and richer job metadata require capture work; no fabricated historical packets.</text>
</svg>