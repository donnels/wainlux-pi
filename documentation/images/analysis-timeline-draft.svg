  <path d="M190 479H1300M190 533H1300M190 579H1300M190 637H1300M190 686H1300" class="separator"/>
  <text x="40" y="508" class="label">Laser RX</text>
  <text x="40" y="526" class="small">Bytes / decoded frames</text>
  <g stroke="#137b63" stroke-width="2">
    <path d="M225 488V524M274 488V524M405 488V524M519 488V524M642 488V524M728 488V524M809 488V524M884 485V528"/>
