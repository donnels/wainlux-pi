  <text x="1260" y="224" class="mono">30:00</text>
  <text x="40" y="251" class="small">Drag the overview window or scroll horizontally; drag either edge to change the visible time span.</text>
  <text x="190" y="275" class="mono">Visible: 28:15.000 - 28:29.063   /   14.063 s</text>
  <rect x="190" y="289" width="1110" height="397" fill="#fff"/>
  <rect x="190" y="296" width="1110" height="390" fill="url(#fine-ticks)"/>
