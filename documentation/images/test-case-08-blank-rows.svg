  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#aaf"/></linearGradient></defs>
  <rect width="900" height="480" fill="url(#bg)"/>
  <text x="35" y="36" font-size="22" font-weight="bold">8: two squares, empty rows between</text>
  <rect x="60" y="95" width="300" height="300" fill="#fff" fill-opacity="0.4" stroke="#000" stroke-dasharray="5 4"/>
  <rect x="60" y="95" width="100" height="100"/><rect x="260" y="295" width="100" height="100"/>
  <path d="M50 195H370M50 295H370" stroke="#666" stroke-dasharray="3 5"/>
  <text x="210" y="250" text-anchor="middle">5 mm blank rows</text>
  <text x="430" y="115" font-weight="bold">Request</text>
  <text x="430" y="145">15 x 15 mm image; two filled 5 mm squares.</text>
  <text x="430" y="175">Second square 5 mm right and below</text>
  <text x="430" y="200">the first square's bottom-right corner.</text>
  <text x="430" y="245" font-weight="bold">Result</text>
  <text x="430" y="275">Single upload: all-zero DATA chunk rejected.</text>
  <text x="430" y="305">Two-band workaround: both squares correct.</text>
  <text x="430" y="335">No marks between them. 205 s, power 500 / depth 10.</text>
