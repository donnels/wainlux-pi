<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="sans-serif" font-size="16">
<!-- Copyright (c) 2026 Sean Donnellan -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#aaf"/></linearGradient>
    <pattern id="etch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#9aacb7" stroke-width="2"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#172633"/>
    </marker>
  </defs>
  <rect width="1240" height="720" fill="url(#bg)"/>
  <text x="40" y="42" font-size="24" font-weight="bold" fill="#172633">Place the card before composing its content</text>
  <text x="40" y="72" fill="#566978">Measured bamboo card: 85.45 x 53.72 mm. Current normal K6 reach: 80 x 75 mm.</text>

  <g transform="translate(55 120)">
    <text x="0" y="0" font-size="19" font-weight="bold" fill="#172633">A. Centered</text>
    <text x="0" y="25" fill="#566978">More width; side alignment is by eye.</text>
    <rect x="35" y="55" width="480" height="450" fill="#fff" stroke="#637786" stroke-width="2" stroke-dasharray="8 5"/>
    <rect x="18.65" y="118.84" width="512.7" height="322.32" rx="14" fill="#e9d9b8" stroke="#8b6f47" stroke-width="3"/>
    <rect x="35" y="118.84" width="480" height="322.32" fill="url(#etch)" opacity="0.55"/>
    <rect x="35" y="114.64" width="480" height="3" fill="#196c53"/>
    <rect x="35" y="442.36" width="480" height="3" fill="#196c53"/>
    <text x="275" y="270" text-anchor="middle" font-weight="bold">Etch width 80 mm</text>
    <text x="275" y="297" text-anchor="middle">Top and bottom markings</text>
    <path d="M35 470H515" stroke="#172633" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="275" y="495" text-anchor="middle">K6 reach: 80 mm</text>
    <text x="275" y="535" text-anchor="middle" fill="#566978">Card overhangs both sides.</text>
  </g>

  <g transform="translate(610 120)">
    <text x="0" y="0" font-size="19" font-weight="bold" fill="#172633">B. Left placement (default)</text>
    <text x="0" y="25" fill="#566978">U guide fixes left and vertical registration.</text>
    <rect x="35" y="55" width="480" height="450" fill="#fff" stroke="#637786" stroke-width="2" stroke-dasharray="8 5"/>
    <rect x="41" y="118.84" width="512.7" height="322.32" rx="14" fill="#e9d9b8" stroke="#8b6f47" stroke-width="3"/>
    <rect x="73.7" y="118.84" width="435.3" height="322.32" fill="url(#etch)" opacity="0.55"/>
    <rect x="35" y="114.64" width="480" height="3" fill="#196c53"/>
    <rect x="35" y="442.36" width="480" height="3" fill="#196c53"/>
    <rect x="36.8" y="114.64" width="3" height="330.72" fill="#196c53"/>
    <path d="M35 140H41" stroke="#172633" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="47" y="92" fill="#172633">1 mm from reach edge</text>
    <text x="292" y="270" text-anchor="middle" font-weight="bold">Centered etch width 72.55 mm</text>
    <text x="292" y="297" text-anchor="middle">Optional guide: top, left, bottom</text>
    <path d="M35 470H515" stroke="#172633" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="275" y="495" text-anchor="middle">K6 reach: 80 mm</text>
    <text x="275" y="535" text-anchor="middle" fill="#566978">Right edge overhangs the reachable area.</text>
  </g>

  <text x="40" y="695" font-size="13" fill="#566978">Green marks are on the backing, 0.2 mm outside the card. They are a placement guide, not the card outline.</text>
</svg>
