  <path d="M45 212H890" stroke="#000" stroke-dasharray="5 4"/>
  <text x="895" y="217" font-size="13">candidate</text>
  <text x="35" y="298">Numbers below squares are requested bottom Y edges, mm. Drawing shows the request, not the captured result.</text>
  <text x="35" y="332" font-weight="bold">Calibration pattern only; no normal working limit is implied.</text>
  <text x="35" y="366">Bottom-edge values are request parameters. Choose a candidate border for the supervised test.</text>
  <text x="35" y="400">This diagram is explanatory, not printable artwork or a captured result.</text>
  <text x="35" y="434">Inspect only after the combined burn has stopped; record the actual observation and verdict.</text>
