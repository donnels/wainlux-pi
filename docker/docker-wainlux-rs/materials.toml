# Materials. One [[material]] per entry. Sizes in mm, width x height as it lies on the bed.
# role: "piece" is what we etch, "backing" is what lies under it and takes the guide.
# [material.settings."<machine model>"] holds that machine's burn settings for this material.
# Keys must match the machine's settings (GET /api/machine). Missing keys use the machine's defaults.

[[material]]
id = "bamboo-ntag215-light"
name = "Bamboo NFC card, light, NXP NTAG215"
role = "piece"
size_mm = [85.45, 53.72]
note = "Chinese ready-made card with the NFC inlay fitted. Size measured. Hard: full power, the K6 is too weak to cut deep."

[material.settings."Wainlux K6"]
power = 1000
depth = 10

[[material]]
id = "backing-first"
name = "Backing board (first QR etch)"
role = "backing"
size_mm = [80.0, 75.0]
note = """Planning placeholder aligned to current K6 reach; physical board dimensions are not measured.
Baseline: a QR scanned at power 500, depth 10. Keep these as the starting settings; no tuning conclusion has been accepted.

Power sweep observations, 2026-11-10, depth 10: block X=0 reported first five lines visible, line 6 faint, line 7 partly visible under magnification, and lines 8-10 not visible on the backing. Its frame covered/overlapped the first line. Adjacent block X=20 showed its first line; the frame appeared high relative to lines aligned with block 1. Alignment is unresolved, so do not compare the two blocks as a calibrated power curve.

The adjacent block's receive trace recorded 99% for its frame and first row, then 0% for lower-power rows; every job was assumed complete after about 90 seconds of silence. This is diagnostic evidence, not proof of when motion stopped. A filled-square and depth/material test on this board remains pending. See documentation/hardware-observations.adoc and the redacted attempt log for the detailed record."""

[material.settings."Wainlux K6"]
power = 500
depth = 10
