  <text x="1040" y="215" font-size="18" font-weight="bold">What changes?</text>
  <text x="1040" y="247">A vs B: gap / continuous at 77.45 mm.</text>
  <text x="1040" y="273">C vs D: gap / continuous at 75 mm.</text>
  <text x="1040" y="313">A vs C and B vs D: requested height.</text>
  <text x="1040" y="339">Inner edges align: Y=28.70-48.70 mm.</text>
  <text x="1040" y="379">B and D keep every row nonblank.</text>
  <text x="1040" y="405">C and D are shorter below the gap.</text>
  <text x="1040" y="445">All squares: 2 x 2 mm.</text>
  <text x="1040" y="471">Lines: one commanded column.</text>
  <text x="1040" y="511">Measure far outer square edges.</text>
  <text x="1040" y="537">Compare total heights and spans,</text>
  <text x="1040" y="563">then bottom-square compression.</text>
  <text x="1040" y="603">A/B: Deviation at the bottom.</text>
  <text x="1040" y="629">C/D: OK, approximately 75 mm.</text>
  <text x="1040" y="669">No left-to-right perimeter test.</text>

  <text x="35" y="739" font-weight="bold">Recorded duration: A 223 s, B 242 s, C 219 s; later D follow-up 237 s. Status stalled near 99%.</text>
  <text x="35" y="769">A/B: Deviation at bottom markers. C/D: OK at approximately 75 mm; gap and continuous pairs matched.</text>
  <text x="35" y="799">Sean selected 75 mm as normal Y working reach. This did not measure the mechanical hard stop.</text>
  <text x="35" y="829">Pattern geometry is the request, not a photograph. No inspection or repositioning occurred within A/B/C.</text>
