[package]
name = "app"
version = "0.1.0"
edition = "2021"
description = "Standalone laser service: web UI, HTTP API, self-test ladder. Driver chosen at start."

[[bin]]
name = "laser-app"
path = "src/main.rs"

[dependencies]
laser = { path = "../laser" }
compose = { path = "../compose" }
k6 = { path = "../k6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
toml = { version = "0.8", default-features = false, features = ["parse"] }
png = "0.17"
base64 = "0.22"

[dev-dependencies]
ureq = { version = "2", default-features = false }
