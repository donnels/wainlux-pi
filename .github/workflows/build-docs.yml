name: Build Documentation

on:
  push:
    branches: [main]
    paths:
      - 'documentation/**'
      - 'documentation/includes/**'
      - 'README.asciidoc'
      - 'CLEAN_ROOM.md'
      - 'LICENSE*'
      - 'robots.txt'
      - 'docinfo.html'
      - 'cli/README.adoc'
      - 'scripts/generate_diagrams.sh'
      - 'scripts/test_docs.sh'
      - 'scripts/build_docs.sh'
      - 'scripts/build_support_containers.sh'
      - 'scripts/build_ghidra_mcp.sh'
      - 'scripts/update_container_image.sh'
      - 'scripts/update_container_images.sh'
      - 'scripts/lib/container.sh'
      - 'docker/README.adoc'
      - 'docker/docker-bytefield/**'
      - 'docker/docker-ghidra-mcp/**'
      - 'docker/docker-plantuml/**'
      - 'docker/docker-asciidoctor/**'
      - 'docker/docker-trivy/**'
      - 'docker/IMAGES.adoc'
      - 'docker/IMAGES.map'
      - 'docker/docker-wainlux-rs/README.adoc'
      - 'docker/docker-wainlux-rs/docker/app/openapi.yaml'
      - '.github/workflows/build-docs.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build, scan, and promote documentation tools
        run: ./scripts/update_container_images.sh --allow-findings asciidoctor bytefield plantuml
      
      - name: Generate diagrams in pinned local containers
        run: ./scripts/generate_diagrams.sh

      - name: Prepare output directory
        run: mkdir -p docs && cp robots.txt docs/robots.txt
      
      - name: Build AsciiDoc with pinned local container
        run: ./scripts/build_docs.sh
      
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: false
