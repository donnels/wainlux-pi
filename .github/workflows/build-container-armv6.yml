name: Build Container (ARMv6)

on:
  push:
    branches: [main]
    paths:
      - 'docker/docker-wainlux-rs/**'
      - 'docker/docker-rust-toolchain/**'
      - 'docker/docker-trivy/**'
      - 'cli/**'
      - 'scripts/build_laser.sh'
      - 'scripts/build_local_container.sh'
      - 'scripts/update_container_image.sh'
      - 'scripts/update_container_images.sh'
      - 'scripts/lib/container.sh'
      - 'docker/IMAGES.map'
      - 'docker/IMAGES.adoc'
      - '.github/workflows/build-container-armv6.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docker/docker-wainlux-rs/**'
      - 'docker/docker-rust-toolchain/**'
      - 'docker/docker-trivy/**'
      - 'cli/**'
      - 'scripts/build_laser.sh'
      - 'scripts/build_local_container.sh'
      - 'scripts/update_container_image.sh'
      - 'scripts/update_container_images.sh'
      - 'scripts/lib/container.sh'
      - 'docker/IMAGES.map'
      - 'docker/IMAGES.adoc'
      - '.github/workflows/build-container-armv6.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-armv6:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build local Rust toolchain
        run: ./scripts/build_local_container.sh rust-toolchain

      - name: Run Rust tests and build the local ARMv6 image
        run: ./scripts/build_laser.sh

      - name: Scan and promote ARMv6 candidate
        run: ./scripts/update_container_image.sh --allow-findings laser-app

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=armv6-latest,enable={{is_default_branch}}
            type=raw,value=armv6-sha-{{sha}}
            type=ref,event=branch
            type=ref,event=pr

      - name: Publish the scanned local image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          printf '%s\n' "$IMAGE_TAGS" | while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag localhost/laser-app:arm "$tag"
            docker push "$tag"
          done
